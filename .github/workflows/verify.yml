name: Verify source and registry

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fiori-design-lab/package-lock.json
            fiori-registry-consumer/package-lock.json

      - name: Install browser verification dependencies
        run: npm ci

      - name: Install design lab dependencies
        run: npm ci
        working-directory: fiori-design-lab

      - name: Install consumer dependencies
        run: npm ci
        working-directory: fiori-registry-consumer

      - name: Verify design lab and generated registry
        run: npm run verify:lab

      - name: Verify independent consumer
        run: npm run verify:consumer

      - name: Verify installed source closure
        run: npm run verify:installation

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify list-report interactions and capture screenshots
        run: npm run test:list-report -- --capture-only

      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: list-report-browser-evidence
          path: output/playwright/current/
          if-no-files-found: warn
